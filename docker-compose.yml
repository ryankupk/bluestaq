services:
  mongo:
    image: mongo:7
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: ${MONGO_DB:-notes}
      MONGO_NOTES_COLLECTION: ${MONGO_NOTES_COLLECTION:-notes}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8080:8080"

volumes:
  mongo-data:
